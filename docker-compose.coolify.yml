services:
  odysseus:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_OPTIONAL: "${INSTALL_OPTIONAL:-false}"
    restart: unless-stopped
    expose:
      - "7000"
    volumes:
      - odysseus-data:/app/data
      - odysseus-logs:/app/logs
      - odysseus-ssh:/app/.ssh
      - odysseus-huggingface:/app/.cache/huggingface
      - odysseus-local:/app/.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LLM_HOST: "${LLM_HOST:-localhost}"
      LLM_HOSTS: "${LLM_HOSTS:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-}"
      RESEARCH_LLM_ENDPOINT: "${RESEARCH_LLM_ENDPOINT:-}"

      HF_TOKEN: "${HF_TOKEN:-}"
      HUGGING_FACE_HUB_TOKEN: "${HUGGING_FACE_HUB_TOKEN:-}"

      SEARXNG_INSTANCE: "http://searxng:8080"
      NTFY_BASE_URL: "http://ntfy:80"
      CHROMADB_HOST: "chromadb"
      CHROMADB_PORT: "8000"
      DATABASE_URL: "${DATABASE_URL:-sqlite:///./data/app.db}"

      AUTH_ENABLED: "true"
      LOCALHOST_BYPASS: "false"
      SECURE_COOKIES: "true"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS to the public HTTPS URL, for example https://ai.example.com}"
      ODYSSEUS_ADMIN_USER: "${ODYSSEUS_ADMIN_USER:-admin}"
      ODYSSEUS_ADMIN_PASSWORD: "${ODYSSEUS_ADMIN_PASSWORD:-}"

      EMBEDDING_URL: "${EMBEDDING_URL:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      FASTEMBED_MODEL: "${FASTEMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}"
      FASTEMBED_CACHE_PATH: "/app/.cache/huggingface"

      CLEANUP_INTERVAL_HOURS: "${CLEANUP_INTERVAL_HOURS:-24}"
      ODYSSEUS_INPROCESS_POLLERS: "${ODYSSEUS_INPROCESS_POLLERS:-1}"
      ODYSSEUS_INPROCESS_TASKS: "${ODYSSEUS_INPROCESS_TASKS:-1}"
      ODYSSEUS_SCRIPT_HOST: "${ODYSSEUS_SCRIPT_HOST:-localhost}"

      ODYSSEUS_CHAT_UPLOAD_MAX_BYTES: "${ODYSSEUS_CHAT_UPLOAD_MAX_BYTES:-10485760}"
      ODYSSEUS_GALLERY_UPLOAD_MAX_BYTES: "${ODYSSEUS_GALLERY_UPLOAD_MAX_BYTES:-104857600}"
      ODYSSEUS_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES: "${ODYSSEUS_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES:-26214400}"
      ODYSSEUS_MEMORY_IMPORT_MAX_BYTES: "${ODYSSEUS_MEMORY_IMPORT_MAX_BYTES:-10485760}"
      ODYSSEUS_PERSONAL_UPLOAD_MAX_BYTES: "${ODYSSEUS_PERSONAL_UPLOAD_MAX_BYTES:-26214400}"
      ODYSSEUS_EMAIL_COMPOSE_UPLOAD_MAX_BYTES: "${ODYSSEUS_EMAIL_COMPOSE_UPLOAD_MAX_BYTES:-26214400}"
      ODYSSEUS_STT_MAX_AUDIO_BYTES: "${ODYSSEUS_STT_MAX_AUDIO_BYTES:-26214400}"
      ODYSSEUS_ICS_MAX_BYTES: "${ODYSSEUS_ICS_MAX_BYTES:-10485760}"
      ODYSSEUS_TTS_CACHE_MAX_BYTES: "${ODYSSEUS_TTS_CACHE_MAX_BYTES:-536870912}"

      DATA_BRAVE_API_KEY: "${DATA_BRAVE_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GOOGLE_PSE_CX: "${GOOGLE_PSE_CX:-}"
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
      GOOGLE_OAUTH_REDIRECT_URI: "${GOOGLE_OAUTH_REDIRECT_URI:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      SERPER_API_KEY: "${SERPER_API_KEY:-}"

      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"

      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-2}"
      OPENBLAS_NUM_THREADS: "${OPENBLAS_NUM_THREADS:-2}"
      MKL_NUM_THREADS: "${MKL_NUM_THREADS:-2}"
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started
      ntfy:
        condition: service_started
    mem_limit: 3g
    cpus: 3.0

  chromadb:
    image: docker.io/chromadb/chroma:latest
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    mem_limit: 1536m
    cpus: 1.25

  searxng-config-init:
    image: docker.io/alpine:3.22
    restart: "no"
    environment:
      SEARXNG_SETTINGS: |
        use_default_settings: true

        general:
          instance_name: "Odysseus Search"

        server:
          secret_key: "${SEARXNG_SECRET:?Set a long random SEARXNG_SECRET}"
          limiter: false
          image_proxy: true

        search:
          safe_search: 0
          autocomplete: ""
          default_lang: "de"
          formats:
            - html
            - json

        ui:
          default_locale: "de"
          query_in_title: false
          infinite_scroll: false
          results_on_new_tab: true
          center_alignment: false
          default_theme: simple
          theme_args:
            simple_style: auto

        doi_resolvers:
          oadoi.org: "https://oadoi.org/"
          doi.org: "https://doi.org/"

        default_doi_resolver: "oadoi.org"
    command:
      - /bin/sh
      - -ec
      - |
        printf '%s\n' "$$SEARXNG_SETTINGS" > /config/settings.yml
        chmod 0644 /config/settings.yml
    volumes:
      - searxng-config:/config
    mem_limit: 64m
    cpus: 0.10

  searxng:
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      searxng-config-init:
        condition: service_completed_successfully
    volumes:
      - searxng-config:/etc/searxng
      - searxng-cache:/var/cache/searxng
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Set a long random SEARXNG_SECRET}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)"
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 20s
    mem_limit: 768m
    cpus: 0.75

  ntfy:
    image: docker.io/binwiederhier/ntfy:latest
    command: serve
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    environment:
      NTFY_BASE_URL: "http://ntfy:80"
    mem_limit: 256m
    cpus: 0.25

volumes:
  odysseus-data:
  odysseus-logs:
  odysseus-ssh:
  odysseus-huggingface:
  odysseus-local:
  chromadb-data:
  searxng-config:
  searxng-cache:
  ntfy-cache:
